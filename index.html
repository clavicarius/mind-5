<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mind 5: fünf Denkaufgaben in einer täglichen Runde. Kostenlos, werbefrei und auf Deutsch.">
  <meta name="theme-color" content="#141c2e">
  <title>Mind 5 – 5 Denkaufgaben, eine Runde täglich</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #141c2e;
      color: #f5f6fa;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 20rem;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem 1rem 2rem;
    }

    main { width: min(100%, 48rem); margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.5rem; }
    header img { width: min(100%, 15rem); height: auto; }
    h1 { margin: 0.5rem 0; font-size: clamp(1.7rem, 5vw, 2.4rem); }
    h2 { margin-top: 0; }
    p { color: #d0d5e2; line-height: 1.55; }
    .card {
      margin: 1rem 0;
      padding: clamp(1rem, 4vw, 1.5rem);
      border: 1px solid #46516b;
      border-radius: 1rem;
      background: #1c263b;
    }
    .muted, .fine-print { color: #b9c3d8; }
    .fine-print { font-size: 0.9rem; }
    .choices, .actions, .progress {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .choices { margin: 1rem 0; }
    .choice, button, select, input[type="text"] {
      min-height: 2.8rem;
      border: 1px solid #65728d;
      border-radius: 0.6rem;
      padding: 0.65rem 0.9rem;
      color: #f5f6fa;
      background: #26344f;
      font: inherit;
    }
    input[type="text"] { width: min(100%, 16rem); }
    button { cursor: pointer; font-weight: 650; }
    button:hover, .choice:hover { background: #354765; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    button.primary { color: #101a2b; background: #b7d2ff; border-color: #b7d2ff; }
    button.primary:hover { background: #d1e2ff; }
    button.danger { background: #4a2934; }
    select { width: 100%; }
    label { display: block; margin: 1rem 0 0.4rem; font-weight: 650; }
    .profile-grid, .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
      gap: 0.7rem;
      margin: 0.8rem 0 1rem;
    }
    .profile-option {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      min-height: 4.4rem;
      padding: 0.75rem;
      border: 1px solid #46516b;
      border-radius: 0.65rem;
      text-align: left;
      background: #202c42;
    }
    .profile-option[aria-pressed="true"] { border-color: #b7d2ff; box-shadow: 0 0 0 2px #b7d2ff; }
    .profile-option span { display: block; }
    .profile-option small { display: block; margin-top: 0.2rem; color: #c3ccdc; }
    .status { min-height: 1.5rem; color: #ffdda1; }
    .progress { gap: 0.45rem; margin: 1rem 0; }
    .progress span {
      flex: 1 1 3rem;
      padding: 0.5rem 0.25rem;
      border: 1px solid #65728d;
      border-radius: 0.5rem;
      color: #d0d5e2;
      font-size: 0.85rem;
    }
    .progress .current { border-color: #b7d2ff; color: #fff; background: #354765; }
    .progress .done { border-color: #8ed3b1; color: #c6f2da; }
    .question { margin: 1.5rem 0; font-size: clamp(1.2rem, 4vw, 1.6rem); font-weight: 650; }
    .choice { flex: 1 1 8rem; text-align: center; }
    .choice[aria-pressed="true"] { border-color: #b7d2ff; box-shadow: 0 0 0 2px #b7d2ff; }
    .choice.incorrect { border-style: dashed; }
    .order-list { display: grid; gap: 0.65rem; margin: 1rem 0; padding-left: 2.5rem; }
    .order-item { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; min-height: 3.2rem; padding: 0.45rem 0.6rem; border: 1px solid #65728d; border-radius: 0.6rem; background: #26344f; touch-action: manipulation; }
    .order-item[draggable="true"] { cursor: grab; }
    .order-item:active { cursor: grabbing; }
    .drag-handle { padding: 0.35rem; cursor: grab; touch-action: none; user-select: none; }
    .order-item .actions { flex-wrap: nowrap; gap: 0.35rem; }
    .order-item button { min-width: 2.8rem; padding-inline: 0.55rem; }
    label.choice { display: flex; align-items: center; justify-content: center; gap: 0.65rem; margin: 0; }
    .choice:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    .puzzle-details { margin: 1rem 0; padding: 0.8rem 1rem; border: 1px solid #46516b; border-radius: 0.65rem; }
    .puzzle-details h3 { margin: 0.4rem 0; font-size: 1rem; }
    .puzzle-details ul { margin: 0.3rem 0 0.8rem; }
    .visual-sequence {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 3.5rem), 1fr));
      gap: 0.5rem;
      margin: 1rem 0;
    }
    .visual-slot, .visual-grid td {
      min-width: 0;
      min-height: 3.8rem;
      padding: 0.35rem;
      border: 1px solid #65728d;
      border-radius: 0.55rem;
      text-align: center;
      vertical-align: middle;
      background: #202c42;
    }
    .visual-grid {
      width: min(100%, 22rem);
      margin: 1rem auto;
      border-spacing: 0.4rem;
      table-layout: fixed;
    }
    .visual-grid td { height: 4.5rem; }
    .missing-slot { color: #fff; font-size: 1.8rem; font-weight: 700; }
    .pattern-token, .grid-token { display: grid; justify-items: center; gap: 0.15rem; }
    .shape-token { display: inline-block; font-size: clamp(1.7rem, 6vw, 2.5rem); line-height: 1.1; }
    .shape-token.size-klein { font-size: 1.25rem; }
    .shape-token.size-mittel { font-size: 1.8rem; }
    .shape-token.size-groß { font-size: 2.25rem; }
    .pattern-token small, .grid-token small, .compare-item small { color: #d0d5e2; font-size: 0.75rem; }
    .visual-choices { justify-content: center; }
    .visual-option { display: flex; min-width: 5rem; flex-direction: column; align-items: center; justify-content: center; }
    .visual-option[aria-pressed="true"], .compare-item[aria-pressed="true"] {
      border-color: #b7d2ff;
      box-shadow: 0 0 0 2px #b7d2ff;
    }
    .shape-canvas { display: block; width: min(100%, 8rem); margin: 0 auto; aspect-ratio: 1; }
    .scene-cell { fill: #b7d2ff; stroke: #f5f6fa; stroke-width: 0.08; }
    .component-1 { fill: #8ed3b1; }
    .component-2 { fill: #ffdda1; }
    .rotation-puzzle { display: grid; grid-template-columns: minmax(5rem, 1fr) auto minmax(0, 2fr); align-items: center; gap: 0.8rem; }
    .rotation-puzzle figure { min-width: 0; margin: 0; text-align: center; }
    .rotation-puzzle figcaption { margin-bottom: 0.4rem; font-weight: 650; }
    .rotation-arrow { font-size: 1.2rem; white-space: nowrap; }
    .rotation-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
    .rotation-options .visual-option { min-width: 0; }
    .compare-panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin: 1rem 0; }
    .compare-panels h3 { font-size: 1rem; }
    .compare-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem; }
    .compare-item {
      display: grid;
      min-width: 0;
      min-height: 4.4rem;
      padding: 0.25rem;
      place-items: center;
      align-content: center;
      border: 1px solid #65728d;
      border-radius: 0.55rem;
      background: #202c42;
    }
    button.compare-item { width: 100%; }
    .compare-item .shape-token { font-size: clamp(1.4rem, 5vw, 2rem); }
    .fill-gestreift { text-decoration: underline; text-decoration-style: double; text-underline-offset: 0.15em; }
    .fill-leer { -webkit-text-stroke: 1px #b7d2ff; color: transparent; }
    @media (max-width: 34rem) {
      .compare-panels { grid-template-columns: 1fr; }
      .rotation-puzzle { grid-template-columns: minmax(4rem, 1fr) auto minmax(0, 1.5fr); gap: 0.4rem; }
      .visual-sequence { gap: 0.3rem; }
      .visual-slot { min-height: 3.2rem; }
    }
    dialog {
      width: min(calc(100% - 2rem), 30rem);
      border: 1px solid #65728d;
      border-radius: 1rem;
      padding: 1.5rem;
      color: #f5f6fa;
      background: #1c263b;
    }
    dialog::backdrop { background: rgb(5 10 20 / 75%); }
    #dialog-message { white-space: pre-line; }
    nav { display: flex; justify-content: center; gap: 1.5rem; margin-top: 2rem; }
    a { color: #b7d2ff; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="src/assets/branding/main-logo-dark.png" alt="Mind 5">
      <h1>5 Denkaufgaben. Eine Runde täglich.</h1>
      <p>Wähle deine Altersgruppe und Schwierigkeit und starte deine Runde.</p>
    </header>
    <div id="game" aria-live="polite">
      <p>Das Spiel wird geladen …</p>
    </div>
    <nav aria-label="Weitere Informationen">
      <a href="https://github.com/clavicarius/mind-5">Projekt auf GitHub</a>
      <a href="https://github.com/clavicarius/mind-5/wiki">Projekt-Wiki</a>
    </nav>
  </main>
  <dialog id="result-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">Aufgabe abgeschlossen</h2>
    <p id="dialog-message"></p>
    <div class="actions">
      <button id="dialog-continue" class="primary" type="button">Weiter</button>
      <button id="dialog-finish" type="button" hidden>Abschließen</button>
    </div>
  </dialog>
  <script type="module" src="src/game.mjs"></script>
</body>
</html>
